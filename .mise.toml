[tools]
bun = "1"

[env]
# Offset from binp-file-explorer's 3000 so both local services can run at once.
PORT = "3010"
NODE_ENV = "development"

# Directory scanned for git repositories (the served root itself plus its
# direct children). Defaults to ~/Developer; a positional CLI argument to the
# server wins over this.
# GIT_GRAPH_ROOT = "/path/to/projects"

[tasks.dev]
description = "Resolve ports (ADR-0037 §2), then start Elysia + Vite concurrently"
run = "bun scripts/dev.ts"

[tasks."dev:ports"]
description = "Probe and report the ports the dev session will bind (ADR-0037 §2)"
run = "bun scripts/dev-ports.ts"

[tasks."dev:server"]
description = "Start Elysia server in watch mode"
run = "bun --watch server/index.ts"

[tasks."dev:client"]
description = "Start Vite dev server"
run = "bunx vite"

[tasks.cli]
description = "Run the bgg CLI from source (serve / daemon / status)"
run = "bun server/cli.ts"

[tasks.build]
description = "Build client (Vite) and server + CLI (Bun)"
run = """
bunx vite build
NODE_ENV=production bun build server/index.ts server/cli.ts --outdir dist/server --target bun --sourcemap=linked --production
"""

[tasks.start]
description = "Start production server"
run = "NODE_ENV=production bun dist/server/index.js"

[tasks.typecheck]
description = "Type-check all TypeScript"
run = "bunx tsc --noEmit"

[tasks.test]
description = "Run unit tests (bun test)"
run = "bun test"
